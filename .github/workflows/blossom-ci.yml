name: Blossom-CI

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      platform:
        description: runs-on argument
        required: false
      args:
        description: Blossom post-processing payload
        required: false

permissions: {}

concurrency:
  group: blossom-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  Authorization:
    name: Authorization
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/build' &&
      contains(fromJSON('["alareynv","nvidia-jelevy","elayd-glitch","ekhazen"]'), github.actor)
    runs-on: blossom
    permissions:
      contents: read
      pull-requests: read
    outputs:
      args: ${{ env.args }}
    steps:
      - name: Authorize request
        run: blossom-ci
        env:
          OPERATION: AUTH
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}

  Vulnerability-scan:
    name: Vulnerability scan
    needs: [Authorization]
    runs-on: vulnerability-scan
    permissions:
      contents: read
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ fromJson(needs.Authorization.outputs.args).repo }}
          ref: ${{ fromJson(needs.Authorization.outputs.args).ref }}
          lfs: true

      - name: Run Blossom scan
        uses: NVIDIA/blossom-action@2b0c950b993808dc31f80a1ccc32615902e39032 # main on 2026-08-18
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
        with:
          args1: ${{ fromJson(needs.Authorization.outputs.args).args1 }}
          args2: ${{ fromJson(needs.Authorization.outputs.args).args2 }}
          args3: ${{ fromJson(needs.Authorization.outputs.args).args3 }}

  Job-trigger:
    name: Start Jenkins job
    needs: [Vulnerability-scan]
    runs-on: blossom
    permissions:
      contents: read
    steps:
      - name: Start Jenkins job
        run: blossom-ci
        env:
          OPERATION: START-CI-JOB
          CI_SERVER: ${{ secrets.CI_SERVER }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Upload-Log:
    name: Upload Jenkins log
    if: github.event_name == 'workflow_dispatch'
    runs-on: blossom
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Publish Jenkins log to pull request
        run: blossom-ci
        env:
          OPERATION: POST-PROCESSING
          CI_SERVER: ${{ secrets.CI_SERVER }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
